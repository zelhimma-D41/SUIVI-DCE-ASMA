<style id="css">:root{
  --paper:#FFFFFF; --panel:#FFFFFF; --sunk:#F2F4F9; --ink:#1B2A63; --muted:#56628F; --line:#DCE0EC; --line2:#C5CBE0;
  --blue:#2B3D81; --blue-2:#23346F; --blue-soft:#E9ECF5; --on-blue:#FFFFFF;
  --green:#9BC455; --green-ink:#557F1D; --green-soft:#EFF6E3;
  --amber:#7D8CC0; --amber-soft:#E9ECF5; --red:#B8423C; --red-soft:#F7E3E1;
  --todo:#C9CFE2; --plate:#FFFFFF;
  --s0:#EDEFF6; --s1:#C3CCE6; --s2:#CFE4AD; --s3:#9BC455;
  --s0-ink:#56628F; --s1-ink:#1B2A63; --s2-ink:#34520F; --s3-ink:#1F3508;
  --font-title:"Tw Cen MT","Tw Cen MT Std","Tw Cen","Jost","Century Gothic","Futura",system-ui,sans-serif;
  --font:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:10px;
  color-scheme:light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-title);font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.muted{color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 120px}
.col{max-width:820px}

/* ---------- en-tête ---------- */
.mast{border-bottom:3px solid var(--green);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;gap:14px;align-items:center}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:10px;padding:7px 9px;flex:none}
.plate img{display:block;width:92px;height:auto}
.who{font-size:.84rem;color:var(--muted);line-height:1.35}
.who b{display:block;color:var(--blue);font-family:var(--font-title);font-weight:600;font-size:1rem}
.mode{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.hero{padding-block:14px 8px;display:grid;gap:12px}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.6rem);letter-spacing:-.015em;max-width:22ch;color:var(--ink)}
.hero h1 span{display:block;color:var(--blue);font-weight:500;font-size:.62em;letter-spacing:0;margin-top:6px}
.lede{max-width:68ch;font-size:1rem;color:var(--ink)}
.stamp{font-size:.82rem;color:var(--muted)}
.plannote{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;background:var(--blue-soft);border-radius:var(--radius);padding:10px 14px;font-size:.9rem;max-width:820px}
.plannote p{flex:1 1 320px}

/* ---------- piste des phases ---------- */
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:18px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ph{position:relative;display:grid;gap:6px;align-content:start;padding:14px 16px 14px 18px;border:0;border-right:1px solid var(--line);background:none;text-align:left;min-width:0}
.ph:last-child{border-right:0}
.ph:hover{background:var(--sunk)}
.ph.cur{background:var(--blue-soft)}
.ph .n{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ph .n b{font-family:var(--font-title);font-size:.86rem;color:var(--muted);font-weight:600}
.ph.cur .n b{color:var(--blue)}
.ph .v{font-family:var(--font-title);font-weight:600;font-size:1.9rem;line-height:1;color:var(--ink)}
.ph .t{font-weight:600;font-size:.94rem;line-height:1.25}
.ph small{color:var(--muted);font-size:.78rem;line-height:1.35}
.ph .st{font-size:.76rem;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.ph.cur .st{background:var(--blue);color:var(--on-blue)}
.ph.fin .st{background:var(--green-soft);color:var(--green-ink)}
.gate{position:absolute;right:-8px;top:18px;width:14px;height:14px;transform:rotate(45deg);background:var(--panel);border:2px solid var(--line2);z-index:1}
.gate.ok{background:var(--green);border-color:var(--green)}
.cbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.cbar i{display:block;height:100%;background:var(--green)}
.cbar.lg{height:10px;border-radius:5px}
.cbar.a i{background:var(--blue)}
.latest{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:.88rem;padding:10px 2px;border-bottom:1px solid var(--line)}
.latest b{color:var(--blue);font-weight:600;white-space:nowrap}
.latest span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- carte du référentiel ---------- */
.map{margin:34px 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.map-t{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 16px;border-radius:12px}
.map-t:hover{background:var(--sunk)}
.map-h{display:grid;gap:2px}
.map-h h2{font-size:1.3rem}
.map-s{font-size:.84rem;color:var(--muted)}
.map-c{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:.86rem;flex:none}
.map-c svg{transition:transform .3s ease}
.map.open .map-c svg{transform:rotate(180deg)}
.slide{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.map.open .slide{grid-template-rows:1fr}
.slide-in{overflow:hidden;min-height:0;padding:0 12px}
.map.open .slide-in{padding-bottom:12px}
.slide-in .help{margin:2px 4px 10px}
.fams{display:grid;gap:4px}
.fam{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:5px 6px;border-radius:8px;width:100%}
.fam:hover{background:var(--sunk)}
.fam-n{min-width:0;line-height:1.2}
.fam-n b{font-family:var(--font-title);font-weight:600;color:var(--blue);margin-right:6px}
.fam-n span{font-size:.84rem}
.fam-n small{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.cell{font-family:var(--font-title);font-size:.7rem;font-weight:600;line-height:1;padding:5px 4px;min-width:40px;text-align:center;border-radius:4px;background:var(--s0);color:var(--s0-ink);position:relative}
.cell.k1{background:var(--s1);color:var(--s1-ink)}
.cell.k2{background:var(--s2);color:var(--s2-ink)}
.cell.k3{background:var(--s3);color:var(--s3-ink)}
.cell.ref::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:8px}
.keys span{display:inline-flex;gap:6px;align-items:center}
.keys i{display:inline-block;width:14px;height:10px;border-radius:3px;background:var(--c)}
.keys i.dot{width:6px;height:6px;border-radius:50%}

/* ---------- onglets ---------- */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);display:flex;gap:2px;padding:10px 0;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);white-space:nowrap;font-weight:500}
nav.tabs button:hover{background:var(--sunk);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--blue);color:var(--on-blue)}
section.pane{padding-top:18px}
.pane-h{display:grid;gap:6px;margin-bottom:14px}
.pane-h h2{font-size:1.35rem}
.pane-h p{max-width:68ch;color:var(--muted);font-size:.92rem}
.subh{font-family:var(--font-title);font-weight:600;color:var(--blue);font-size:1rem;margin:20px 0 6px}
.help{font-size:.86rem;color:var(--muted);max-width:66ch;margin:4px 0 10px}

/* ---------- boutons, champs ---------- */
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--on-blue);border-radius:7px;padding:7px 14px;font-weight:500;font-size:.88rem}
.btn:hover{background:var(--blue-2);border-color:var(--blue-2)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--sunk)}
.btn:disabled{opacity:.5}
a.btn{text-decoration:none;display:inline-block;line-height:1.3}
.btns{display:flex;gap:6px;flex-wrap:wrap}
label.f{display:block;font-size:.78rem;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:.92rem;min-width:0}
label.f input[type=date]{-webkit-appearance:none;appearance:none;min-height:37px}
.ro{display:block;margin-top:3px;font-size:.92rem;color:var(--ink)}
.ro.empty{color:var(--muted)}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row2>*{min-width:0}
.notice{background:var(--blue-soft);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.88rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice.info{background:var(--blue-soft)}

/* ---------- chemin (gantt) ---------- */
.path{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin:12px 0}
.path-head,.path-row{display:grid;grid-template-columns:minmax(130px,38%) 1fr;align-items:center}
.path-head{font-size:.76rem;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.weeks{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.path-row{padding:5px 0;border:0;background:none;text-align:left;width:100%;border-radius:6px}
.path-row:hover{background:var(--sunk)}
.path-label{font-size:.85rem;line-height:1.25;padding-right:8px;overflow:hidden}
.path-label b{font-family:var(--font-title);color:var(--blue);margin-right:5px}
.path-label small{display:block;color:var(--muted);font-size:.74rem}
.path-label small.late{color:var(--red)}
.lane{display:grid;grid-template-columns:repeat(3,1fr);height:22px;position:relative;background:repeating-linear-gradient(90deg,transparent 0 calc(33.333% - 1px),var(--line) calc(33.333% - 1px) 33.333%)}
.bar{height:14px;align-self:center;border-radius:4px;margin:0 3px;position:relative;overflow:hidden;background:var(--todo)}
.bar.doing{background:var(--amber-soft);box-shadow:inset 0 0 0 1.5px var(--amber)}
.bar.doing i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.bar.done{background:var(--green)}
.bar.blocked{background:var(--red)}
.today{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--blue);pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);padding:8px 0 2px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.startline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.startline input{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}

/* ---------- cartes d'action ---------- */
.act{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--todo);border-radius:9px;margin-bottom:10px}
.act.doing{border-left-color:var(--amber)} .act.done{border-left-color:var(--green)} .act.blocked{border-left-color:var(--red)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.act>summary{padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.num{font-family:var(--font-title);font-weight:600;font-size:1.05rem;color:var(--blue);min-width:2.2em}
.act h3{font-size:1.02rem}
.meta{font-size:.8rem;color:var(--muted);margin-top:2px}
.warn{color:var(--red);font-size:.8rem;margin-top:3px}
.volmeta{font-size:.8rem;color:var(--blue);margin-top:2px}
.pill{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.doing{background:var(--amber-soft);color:var(--ink)} .pill.done{background:var(--green-soft);color:var(--green-ink)} .pill.blocked{background:var(--red-soft);color:var(--red)} .pill.na{opacity:.7}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green)}
.act-body{padding:0 14px 14px;border-top:1px solid var(--line)}
.crit{margin:12px 0 4px;font-size:.88rem;background:var(--blue-soft);border-radius:6px;padding:8px 10px}
.crit b{color:var(--blue)}
.decbox{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 4px;background:var(--sunk)}
.decbox b{display:block;color:var(--blue)}
.decbox span{font-size:.84rem;color:var(--muted)}
ol.steps{margin:12px 0 0;padding:0;list-style:none}
ol.steps label{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem;align-items:start}
ol.steps li:last-child label{border-bottom:0}
ol.steps input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green-ink)}
ol.steps input:checked+span{color:var(--muted);text-decoration:line-through}
.review{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:18px}
.review h3{font-size:1.05rem;margin-bottom:6px}
.review ul{list-style:none;margin:0;padding:0}
.review li{display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:6px 0;font-size:.9rem;border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}
.ok{color:var(--green-ink);font-weight:600} .ko{color:var(--todo)}
.okline{color:var(--green-ink);font-weight:600}
.warnline{color:var(--amber)}

/* ---------- volets par famille ---------- */
.vol{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.vol h4{font-size:1rem;color:var(--blue)}
.vfam{border:1px solid var(--line);border-left:4px solid var(--todo);border-radius:8px;margin-bottom:8px;background:var(--paper)}
.vfam.doing{border-left-color:var(--amber)} .vfam.done{border-left-color:var(--green)} .vfam.na{opacity:.7}
.vfam>summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 10px}
.fcode{font-family:var(--font-title);font-weight:600;color:var(--on-blue);background:var(--blue);border-radius:5px;min-width:34px;text-align:center;padding:1px 6px;font-size:.86rem}
.vfam summary b{font-weight:600;font-size:.93rem}
.vfam summary small{display:block;color:var(--muted);font-size:.78rem}
.tag{font-size:.7rem;background:var(--green-soft);color:var(--green-ink);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.vfam-body{padding:0 10px 10px;border-top:1px solid var(--line)}
.pair{display:grid;grid-template-columns:70px 1fr;gap:6px}
.pair>*{min-width:0}
.lots{margin-top:12px;border-top:1px solid var(--line)}
.lot{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
.lcode{font-family:var(--font-title);font-weight:600;color:var(--blue);font-size:.88rem;min-width:44px}
.lname{font-size:.88rem}
.lot.done .lname{color:var(--muted)}
.lctl{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:.8rem;color:var(--muted)}
.lctl select,.lctl input{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;font-size:.84rem}
.lctl input{width:58px}
.lctl select{max-width:140px}
.x{border:1px solid var(--line2);background:var(--panel);border-radius:6px;width:28px;height:28px;color:var(--muted);line-height:1}
.addlots{margin-top:10px}
.rowbtn{display:flex;gap:12px;align-items:center;margin-top:6px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--red);font-size:.84rem;text-decoration:underline;padding:0}
.addfam{display:grid;grid-template-columns:78px 1fr auto;gap:6px;margin-top:8px}
.addfam input{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font-size:.9rem;min-width:0}

/* ---------- phases 1 à 3, collecte ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.card>summary{padding:12px 14px;display:block}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h b{font-size:1rem}
.big{font-family:var(--font-title);font-weight:600;font-size:1.3rem;color:var(--blue);white-space:nowrap}
.card-s{display:block;font-size:.8rem;color:var(--muted);margin-top:6px}
.card-body{padding:0 14px 14px;border-top:1px solid var(--line)}
.card .card{background:var(--paper)}
.criteria{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.criteria label{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.92rem}
.criteria input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green-ink)}
.criteria input:checked+span{color:var(--green-ink);font-weight:500}
.cond{border-radius:10px;padding:12px 14px;background:var(--blue-soft);border-left:4px solid var(--blue);font-size:.92rem;margin-bottom:12px}
.cond.ok{background:var(--green-soft);border-left-color:var(--green)}
.cond b{display:block;font-family:var(--font-title);font-size:1.05rem;margin-bottom:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font-size:.88rem}
.group-title{font-size:.88rem;margin:14px 0 6px;color:var(--muted);font-weight:600}
.doc{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;background:var(--panel)}
.doc .code{font-family:var(--font-title);font-weight:600;color:var(--blue)}
.doc .txt{font-size:.88rem}
.doc .who{grid-column:2;font-size:.78rem;color:var(--muted)}
.doc .ctl{grid-column:2;margin-top:4px}
.prio{font-size:.7rem;font-weight:600;border-radius:4px;padding:1px 6px;border:1px solid var(--line2);color:var(--muted)}
.prio.A{border-color:var(--blue);color:var(--blue)}
.link{font-size:.72rem;background:var(--green-soft);color:var(--green-ink);border-radius:4px;padding:1px 6px}
.cst{font-size:.74rem;border-radius:4px;padding:1px 7px;background:var(--sunk);color:var(--muted)}
.cst.got{background:var(--green-soft);color:var(--green-ink)} .cst.part{background:var(--amber-soft);color:var(--ink)} .cst.asked{background:var(--blue-soft);color:var(--blue)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);width:100%;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 2px;font-size:.74rem;line-height:1.2;color:var(--muted);border-right:1px solid var(--line);text-align:center}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.colind{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;margin:10px 0 6px}
.colind-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
.colind-h b{display:block;color:var(--blue)}
.colind-h span{font-size:.8rem;color:var(--muted)}
.colind-big{font-family:var(--font-title);font-weight:600;font-size:1.7rem;color:var(--blue);line-height:1}
.colrow{display:grid;grid-template-columns:minmax(110px,34%) 1fr auto auto;gap:8px;align-items:center;width:100%;border:0;background:none;padding:6px 0;text-align:left;border-radius:6px}
.colrow:hover{background:var(--sunk)}
.colrow .cn{font-size:.86rem}
.cp{font-size:.84rem;font-weight:600;color:var(--blue);min-width:40px;text-align:right}
.ca{font-size:.76rem;color:var(--muted);min-width:48px;text-align:right}
.colind-a{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);margin:8px 0}
.colind-n{font-size:.74rem;color:var(--muted);margin-top:6px}

/* ---------- documents ---------- */
.dgrp{font-size:1.1rem;color:var(--blue);margin:22px 0 8px}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.dcard b{font-size:.97rem}
.dcard .v{font-size:.8rem;color:var(--muted)}
.dcard p{font-size:.86rem;flex:1}
.dcard .btns{margin-top:4px}
.dcard .btn{padding:5px 11px;font-size:.82rem}
.frow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.frow b{display:block;font-size:.88rem;font-weight:500;overflow-wrap:anywhere}
.frow span{font-size:.78rem;color:var(--muted)}
.frow .btn{padding:5px 10px;font-size:.8rem}
.refrow{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.refc{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.refcode{font-family:var(--font-title);font-weight:600;color:var(--on-blue);background:var(--blue);border-radius:5px;padding:1px 7px;font-size:.84rem;white-space:nowrap}
.refb b{display:block;font-size:.92rem}
.refb span{display:block;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.refb .refm{margin-top:3px;font-size:.78rem}
.refb .btns{margin-top:6px}

/* ---------- lecteur ---------- */
.reader{position:fixed;inset:0;z-index:30;background:var(--panel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--green)}
.rbar b{font-size:.95rem;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbody{overflow-y:auto;padding:16px 16px 40px;max-width:840px;width:100%;margin:0 auto;font-size:.93rem}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.rhead .plate img{width:70px}
.rt-title{font-family:var(--font-title);font-weight:600;font-size:1.25rem;color:var(--blue);line-height:1.2}
.rbody h2{font-size:1.15rem;color:var(--blue);margin:22px 0 8px}
.rbody h3{font-size:1rem;color:var(--blue);margin:16px 0 6px}
.rbody p{margin:6px 0;max-width:72ch}
.rbody blockquote{margin:8px 0;padding:4px 0 4px 12px;border-left:3px solid var(--green);color:var(--muted);font-style:italic}
.rt-wrap{overflow-x:auto;margin:8px 0}
.rt{border-collapse:collapse;font-size:.84rem;width:100%}
.rt th,.rt td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.rt th{background:var(--blue);color:var(--on-blue);font-weight:600}
.rt.fiche th{background:var(--green-soft);color:var(--ink);width:30%}
.rbody ol,.rbody ul{padding-left:22px;margin:6px 0}
.rbody li{margin:3px 0}

/* ---------- journal ---------- */
.jtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.jtop span{font-size:.84rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chips button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.84rem;text-align:left}
.chips button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.jday{font-weight:600;color:var(--blue);font-size:.9rem;margin:16px 0 4px;font-family:var(--font-title)}
.entry{display:grid;grid-template-columns:14px 1fr;gap:12px;position:relative;padding-bottom:12px}
.entry::before{content:"";position:absolute;left:6px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.jdot{width:14px;height:14px;border-radius:50%;background:var(--blue);margin-top:4px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--paper)}
.entry.t-jalon .jdot,.entry.t-origin .jdot{background:var(--green)}
.entry.t-dcision .jdot{background:var(--green-ink)}
.entry.t-avancement .jdot{background:var(--amber)}
.entry.t-pointdereprise .jdot{background:var(--blue)}
.entry.t-runion .jdot,.entry.t-note .jdot{background:var(--todo)}
.jtype{font-size:.78rem;font-weight:600;color:var(--muted)}
.entry p{white-space:pre-wrap;font-size:.93rem;max-width:72ch}
.entry .lnk{border:0;background:none;color:var(--muted);font-size:.78rem;padding:0;margin-top:3px;text-decoration:underline}
.jform{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;margin-top:8px}
.jform .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jadd>summary{color:var(--blue);font-weight:600;font-size:.92rem;padding:8px 0}

/* ---------- interroger ---------- */
.ask{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.ask textarea{width:100%;min-height:78px;background:var(--paper);border:1px solid var(--line2);border-radius:6px;padding:8px 10px}
.q{font-weight:600;margin-top:16px}
.a{white-space:pre-wrap;margin-top:4px;line-height:1.6;max-width:72ch}

/* ---------- barre d'enregistrement ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--blue);color:var(--on-blue);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
.savebar span{font-size:.88rem}
.savebar .btn{background:var(--green);border-color:var(--green);color:#1B2A63}
footer.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);max-width:820px}

@media (max-width:760px){
  .track{grid-template-columns:1fr 1fr}
  .ph:nth-child(2){border-right:0}
  .ph:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .ph:nth-child(2) .gate{display:none}
  .fam{grid-template-columns:1fr}
}
@media (max-width:520px){
  .row2,.jform .row{grid-template-columns:1fr}
  .seg button{font-size:.66rem}
  .ph .v{font-size:1.6rem}
  .latest{grid-template-columns:1fr}
  .colrow{grid-template-columns:minmax(90px,34%) 1fr auto}
  .colrow .ca{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- barre d'outils : recherche et rapport ---------- */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.search{position:relative;flex:1 1 320px;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-size:.92rem}
.search input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.srbox{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:12;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 28px rgba(27,42,99,.14);max-height:min(420px,60vh);overflow-y:auto;padding:4px}
.sr{display:grid;grid-template-columns:88px 1fr;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;align-items:start}
.sr:hover,.sr:focus-visible{background:var(--sunk)}
.sr-k{font-size:.72rem;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:2px 6px;justify-self:start;margin-top:1px}
.sr-b{min-width:0}
.sr-b b{display:block;font-weight:500;font-size:.88rem;line-height:1.35}
.sr-c{font-family:var(--font-title);font-weight:600;color:var(--blue)}
.sr-b small{display:block;font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-empty{padding:12px;font-size:.86rem;color:var(--muted)}
mark{background:#E4F0CC;color:inherit;border-radius:2px;padding:0 1px}
.flash{animation:flash 2.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--green)}100%{box-shadow:0 0 0 3px transparent}}

/* ---------- calendrier ---------- */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin:12px 0}
.cal-axis,.cal-row{display:grid;grid-template-columns:minmax(150px,36%) 1fr;align-items:center;gap:8px}
.cal-axis{border-bottom:1px solid var(--line);padding-bottom:6px}
.cal-m{position:relative;height:16px;font-size:.72rem;color:var(--muted)}
.cal-m span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.cal-row{border:0;background:none;text-align:left;width:100%;padding:6px 0;border-radius:6px}
.cal-row:hover{background:var(--sunk)}
.cal-lbl{font-size:.86rem;line-height:1.25;min-width:0}
.cal-lbl b{display:block;font-weight:600}
.cal-lbl small{display:block;font-size:.74rem;color:var(--muted)}
.cal-lbl small.late{color:var(--red);font-weight:600}
.cal-lane{position:relative;height:22px;background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.cal-bar{position:absolute;top:4px;height:14px;border-radius:4px;background:var(--s1);overflow:hidden}
.cal-bar i{display:block;height:100%;background:var(--blue)}
.cal-bar.done{background:var(--green)} .cal-bar.done i{background:var(--green)}
.cal-bar.open{background:var(--s1)} .cal-bar.open i{background:repeating-linear-gradient(135deg,var(--blue) 0 6px,var(--blue-2) 6px 12px);opacity:.55}
.cal-bar.alert{box-shadow:inset 0 0 0 2px var(--red)}

/* ---------- indicateurs ---------- */
.inds{display:grid;gap:10px}
.ind{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--todo);border-radius:10px;padding:12px 14px}
.ind.ok{border-left-color:var(--green)} .ind.ko{border-left-color:var(--red)}
.ind-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.ind-h b{font-size:.98rem}
.ind-v{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:6px 0 2px}
.ind-n{font-family:var(--font-title);font-weight:600;font-size:1.7rem;color:var(--blue);line-height:1}
.ind-t{font-size:.84rem;color:var(--muted)}
.ind .help{margin:4px 0 0}

/* ---------- qui fait quoi ---------- */
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.role{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.role-h b{display:block;font-family:var(--font-title);font-weight:600;color:var(--blue);font-size:1rem;line-height:1.25}
.role-h span{display:block;font-size:.8rem;color:var(--muted);margin-top:3px}
.role dl{margin:0;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.role dl div{display:grid;grid-template-columns:80px 1fr;gap:6px;font-size:.86rem}
.role dt{color:var(--muted)}
.role dd{margin:0;font-weight:500}
.role dd.empty{color:var(--muted);font-weight:400;font-style:italic}
@media (max-width:520px){.sr{grid-template-columns:1fr;gap:4px}.cal-axis,.cal-row{grid-template-columns:1fr}.cal-axis .cal-lbl{display:none}}

/* ---------- rapport ---------- */
.report h2{font-family:var(--font-title);font-size:1.12rem;color:var(--blue);margin:20px 0 8px}
.report ul{padding-left:20px}
.print{max-width:780px;margin:0 auto;padding:4px 0;font-size:9.5pt;line-height:1.4}
.print .rt{font-size:8.3pt}
.print .rt th,.print .rt td{padding:3px 6px}
.print h2{margin:12px 0 5px}
.print h2{break-after:avoid;font-size:13pt}
.print tr{break-inside:avoid}
.print .rhead{border-bottom:3px solid var(--green);padding-bottom:10px;margin-bottom:6px}
.pfoot{font-size:8pt;color:var(--muted);margin-top:16px}
@page{size:A4;margin:14mm 14mm 16mm}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ================= état ================= */
var el=document.getElementById("state");
var state=JSON.parse(el.textContent);
function normState(){
  state.actions=state.actions||{};state.journal=state.journal||[];state.col=state.col||{};
  ACTIONS.forEach(function(a){var x=state.actions[a.c]||(state.actions[a.c]={});x.status=x.status||"todo";x.steps=x.steps||[];while(x.steps.length<a.s.length)x.steps.push(false);x.owner=x.owner||"";x.due=x.due||"";x.note=x.note||""});
  normVol();normProg();
}
function normVol(){
  if(!state.fams)state.fams=JSON.parse(JSON.stringify(FAM0));
  state.vol=state.vol||{};
  Object.keys(VOL).forEach(function(c){var V=state.vol[c]=state.vol[c]||{};
    state.fams.forEach(function(f){var v=V[f.id]=V[f.id]||{};v.st=v.st||"todo";v.note=v.note||"";if(VOL[c].counts){v.refs=v.refs==null?"":v.refs;v.ok=v.ok==null?"":v.ok}v.lots=v.lots||{};
      f.lots.forEach(function(l){var x=v.lots[l.id]=v.lots[l.id]||{};x.st=x.st||"todo";if(VOL[c].counts){x.refs=x.refs==null?"":x.refs;x.ok=x.ok==null?"":x.ok}});
      Object.keys(v.lots).forEach(function(k){if(!f.lots.some(function(l){return l.id===k}))delete v.lots[k]})});
    Object.keys(V).forEach(function(k){if(!state.fams.some(function(f){return f.id===k}))delete V[k]})});
}
function normProg(){var p=state.prog=state.prog||{};function arr(a,n){a=a||[];while(a.length<n)a.push(false);return a}
  p.p1s=arr(p.p1s,P1S.length);p.p1c=arr(p.p1c,P1C.length);p.p3=arr(p.p3,P3S.length);p.p2=p.p2||{};P2F.forEach(function(f){p.p2[f.id]=arr(p.p2[f.id],P2S.length)})}
normState();

/* ================= utilitaires ================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(iso){if(!iso)return"";var p=iso.slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function longDate(iso){var d=new Date(iso.slice(0,10)+"T00:00:00");if(isNaN(d))return iso;var s=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1)}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function num(v){var n=parseInt(v,10);return isNaN(n)?0:n}
function cnt(a){return a.filter(Boolean).length}
function pct(n,d){return d?Math.round(n/d*100):0}
function bar(v,cls){return'<span class="cbar'+(cls?" "+cls:"")+'"><i style="width:'+v+'%"></i></span>'}
function dis(){return ui.edit?"":" disabled"}
function plural(n,s){return n+" "+s+(n>1?"s":"")}
function roText(v,ph){return'<span class="ro'+(v?"":" empty")+'">'+esc(v||ph||"Non renseigné")+'</span>'}

/* ================= calculs ================= */
function stepsDone(c){return state.actions[c].steps.filter(Boolean).length}
function weekNow(){if(!state.start)return null;var s=new Date(state.start+"T00:00:00");return Math.floor((today()-s)/864e5)/7+1}
function depsPending(a){return a.dep.filter(function(d){return state.actions[d].status!=="done"})}
function late(a){var w=weekNow();return w!=null&&w>=a.w[1]+1&&state.actions[a.c].status!=="done"}
function doneActions(){return ACTIONS.filter(function(a){return state.actions[a.c].status==="done"}).length}
function famValidated(){var n=state.prog.p1c[4]?1:0;P2F.forEach(function(f){if(state.prog.p2[f.id][5])n++});return n}
function phasePct(n){var p=state.prog;
  if(n===0)return pct(doneActions(),ACTIONS.length);
  if(n===1)return pct(cnt(p.p1s)+cnt(p.p1c),P1S.length+P1C.length);
  if(n===2){var d=0,t=0;P2F.forEach(function(f){if(f.extra)return;d+=cnt(p.p2[f.id]);t+=P2S.length});return pct(d,t)}
  return pct(cnt(p.p3),P3S.length)}
function curPhase(){for(var n=0;n<4;n++)if(phasePct(n)<100)return n;return 3}
function phaseSt(n){var v=phasePct(n);return v>=100?"Terminée":(v>0||n===curPhase())?"En cours":"À venir"}

/* collecte */
var COLIDX={};COL.forEach(function(f){f.items.forEach(function(it){COLIDX[it[0]]=it})});
function colSt(code,d){var it=COLIDX[code];if(!it)return"todo";if(it[5]&&COLIDX[it[5]]&&(d||0)<3)return colSt(it[5],(d||0)+1);return state.col[code]||it[6]}
function colSet(code,v){var it=COLIDX[code];var k=it&&it[5]&&COLIDX[it[5]]?it[5]:code;state.col[k]=v}
function colStats(f,skipLinked){var r={n:0,got:0,part:0,asked:0,na:0,an:0,agot:0,apart:0};f.items.forEach(function(it){if(skipLinked&&it[5]&&COLIDX[it[5]])return;var s=colSt(it[0]);if(s==="na"){r.na++;return}r.n++;if(s==="got")r.got++;if(s==="part")r.part++;if(s==="asked")r.asked++;if(it[4]==="A"){r.an++;if(s==="got")r.agot++;if(s==="part")r.apart++}});
  r.pct=r.n?Math.round((r.got+r.part/2)/r.n*100):0;r.apct=r.an?Math.round((r.agot+r.apart/2)/r.an*100):0;return r}
function colGlobal(){var g={n:0,got:0,part:0,asked:0,an:0,agot:0,apart:0};COL.forEach(function(f){var s=colStats(f,true);["n","got","part","asked","an","agot","apart"].forEach(function(k){g[k]+=s[k]})});
  g.pct=g.n?Math.round((g.got+g.part/2)/g.n*100):0;g.apct=g.an?Math.round((g.agot+g.apart/2)/g.an*100):0;return g}
function colOf(id){return COL.filter(function(f){return f.id===id})[0]}
function filesForItem(code){return COLLECTED.filter(function(r){return r.item===code}).length}

/* volets */
function famStats(c,f){var v=state.vol[c][f.id],r={lots:f.lots.length,done:0,na:0,refs:num(v.refs),ok:num(v.ok)};
  f.lots.forEach(function(l){var x=v.lots[l.id];if(x.st==="done")r.done++;if(x.st==="na")r.na++;if(VOL[c].counts){r.refs+=num(x.refs);r.ok+=num(x.ok)}});return r}
function famLabel(f){return(f.code?f.code+" ":"")+f.name}
function volSummary(c){var d=0,n=0;state.fams.forEach(function(f){var s=state.vol[c][f.id].st;if(s!=="na"){n++;if(s==="done")d++}});return d+"/"+n+" famille"+(n>1?"s":"")+" terminée"+(d>1?"s":"")}

/* carte du référentiel */
var GROUP={EVP:"EVP",VRD:"VRD",ECL:"ECL",TER:"BAT",GOS:"BAT",ENV:"BAT",SOF:"BAT",FLU:"BAT",ELB:"BAT",PRE:"AUT",OAH:"AUT",AUS:"AUT",EQS:"AUT"};
var STAGES=["À venir","Collecte des sources","Production et contrôle","Validé V1.0"];
function famStage(code){var g=GROUP[code]||"AUT",p=state.prog;
  if(g==="EVP"){if(p.p1c[4])return 3;if(cnt(p.p1s)+cnt(p.p1c)>0)return 2;return colStats(colOf("EVP")).pct>0?1:0}
  var a=p.p2[g];if(a[5])return 3;if(cnt(a)>0)return 2;var c=colOf(g);return c&&colStats(c).pct>0?1:0}
function famPhase(code){var g=GROUP[code]||"AUT";return g==="EVP"?(famStage(code)>=2?1:0):2}

/* ================= rendu : en-tête ================= */

    (ui.canEdit?'<div class="mode">'+(ui.edit?'<span>Mode modification</span><button class="btn ghost" data-mode="0">Terminer</button>':'<button class="btn ghost" data-mode="1">Modifier le suivi</button>')+'</div>':'')+'</header>'+

}
function trackHTML(){var cur=curPhase();
  return '<div class="track" role="list" aria-label="Phases du programme">'+PHASES.map(function(p,n){var v=phasePct(n),st=phaseSt(n);
    return '<button class="ph'+(n===cur?" cur":"")+(v>=100?" fin":"")+'" role="listitem" data-tab="p'+n+'"><span class="n"><b>Phase '+p[0]+'</b><span class="st">'+st+'</span></span><span class="v">'+v+' %</span>'+bar(v)+'<span class="t">'+esc(p[1])+'</span><small>'+esc(p[2])+'</small>'+(n<3?'<span class="gate'+(v>=100?" ok":"")+'" title="Porte de validation"></span>':'')+'</button>'}).join("")+'</div>';

  fams.forEach(function(f){var k=famStage(f.code),c=GROUP[f.code]&&colOf(GROUP[f.code]==="AUT"?"":GROUP[f.code]);var cs=c?colStats(c).pct:null;
    var r06=state.vol["0.6"][f.id];
    h+='<button class="fam" data-fam="'+esc(f.code)+'"><span class="fam-n"><b>'+esc(f.code)+'</b><span>'+esc(f.name)+'</span><small>'+STAGES[k]+(f.pilot?", famille pilote":"")+(cs!=null?", collecte "+(c.id==="BAT"?"Bâtiment ":"")+cs+" %":"")+'</small></span><span class="cells">'+
      f.lots.map(function(l){var ref=r06&&r06.lots[l.id]&&r06.lots[l.id].st==="done";return'<span class="cell k'+k+(ref?" ref":"")+'" title="'+esc(l.code+" "+l.name)+'">'+esc(l.code)+'</span>'}).join("")+'</span></button>'});
  h+='</div><div class="keys">'+STAGES.map(function(s,i){return'<span><i style="--c:var(--s'+i+')"></i>'+s+'</span>'}).join("")+'<span><i class="dot" style="--c:var(--blue)"></i>Références vérifiées</span></div></div></div></section>';
  return h;

/* ================= phase 0 ================= */
function pathHTML(){var w=weekNow();
  var h='<div class="path" aria-label="Calendrier de la phase 0"><div class="path-head"><span>Action</span><div class="weeks"><span>Sem. 1</span><span>Sem. 2</span><span>Sem. 3</span></div></div>';
  ACTIONS.forEach(function(a){var x=state.actions[a.c],p=Math.round(stepsDone(a.c)/a.s.length*100);
    h+='<button class="path-row" data-goto="'+a.c+'"><span class="path-label"><b>'+a.c+'</b>'+esc(a.t.length>38?a.t.slice(0,36)+"…":a.t)+'<small'+(late(a)?' class="late"':'')+'>'+ST[x.status]+(late(a)?", en retard":"")+'</small></span><span class="lane"><span class="bar '+x.status+'" style="grid-column:'+a.w[0]+' / '+(a.w[1]+1)+'">'+(x.status==="doing"?'<i style="width:'+p+'%"></i>':"")+'</span>'+

}
function selST(a,x){if(!ui.edit)return'<span class="ro">'+ST[x.status]+'</span>';return'<select data-a="'+a.c+'" data-k="status">'+Object.keys(ST).map(function(k){return'<option value="'+k+'"'+(x.status===k?" selected":"")+'>'+ST[k]+'</option>'}).join("")+'</select>'}
function actionsHTML(){var h="";
  ACTIONS.forEach(function(a){var x=state.actions[a.c],n=stepsDone(a.c),dp=depsPending(a);
    h+='<details class="act '+x.status+'" id="act-'+a.c.replace(".","-")+'" data-act="'+a.c+'"'+(ui.open[a.c]?" open":"")+'><summary><span class="num">'+a.c+'</span><span><h3>'+esc(a.t)+'</h3><div class="meta">'+esc(a.p)+', '+esc(a.d)+(a.dep.length?", après "+a.dep.join(", "):"")+'. Étapes '+n+'/'+a.s.length+(x.due?", échéance le "+fmt(x.due):"")+'</div>'+

      '<div class="row2"><label class="f">Statut'+selST(a,x)+'</label><label class="f">Échéance'+(ui.edit?'<input type="date" data-a="'+a.c+'" data-k="due" value="'+esc(x.due)+'">':roText(fmt(x.due),"Non fixée"))+'</label></div>'+
      '<div class="row2"><label class="f" style="grid-column:1 / -1">Responsable désigné'+(ui.edit?'<input type="text" data-a="'+a.c+'" data-k="owner" value="'+esc(x.owner)+'" placeholder="Nom et fonction">':roText(x.owner,"Pas encore désigné"))+'</label></div>'+
      '<div class="crit"><b>Critère de fin.</b> '+esc(a.crit)+'</div>'+
      (a.c==="0.1"?'<div class="decbox"><div><b>Note des 9 points de décision</b><span>Fiches, recommandations du guide et relevé à signer.</span></div><div class="btns"><button class="btn" data-read="dec">Lire la note</button>'+dlBtn("dec","pdf","PDF")+''+dlBtn("dec","docx","Word")+'</div></div>':'')+
      (a.c==="0.5"?'<div class="decbox"><div><b>Classeur cible, version 0.7</b><span>Taxonomie, listes, référentiels, paramètres, 13 feuilles Prix et tableau de bord.</span></div><div class="btns"><button class="btn" data-read="cls">Lire la fiche</button>'+dlBtn("cls","xlsx","Excel")+'</div></div>':'')+
      '<ol class="steps">'+a.s.map(function(s,i){return'<li><label><input type="checkbox" data-a="'+a.c+'" data-step="'+i+'"'+(x.steps[i]?" checked":"")+dis()+'><span>'+esc(s)+'</span></label></li>'}).join("")+'</ol>'+
      (VOL[a.c]?volHTML(a.c):'')+
      '<label class="f" style="margin-top:12px">Notes, points bloquants'+(ui.edit?'<textarea rows="3" data-a="'+a.c+'" data-k="note">'+esc(x.note)+'</textarea>':roText(x.note,"Aucune note"))+'</label></div></details>'});
  var all=ACTIONS.every(function(a){return state.actions[a.c].status==="done"});
  h+='<div class="review"><h3>Revue de sortie de la phase 0</h3><ul>'+ACTIONS.map(function(a){var ok=state.actions[a.c].status==="done";return'<li><span class="'+(ok?"ok":"ko")+'">'+(ok?"✓":"○")+'</span><span>'+esc(a.exit)+'</span><span class="muted">'+a.c+'</span></li>'}).join("")+'</ul><p class="help" style="margin:8px 0 0">'+(all?"Tous les critères sont remplis : la revue de sortie peut être tenue.":"Un critère est coché quand l’action passe au statut « Fait ».")+'</p></div>';
  return h;

    h+='</div></details>'});

  return h+'</div>';

/* ================= collecte ================= */
function colFamHTML(f,title){var s=colStats(f),key="c:"+f.id;
  var h='<details class="card" id="col-'+f.id+'" data-act="'+key+'"'+(ui.open[key]?" open":"")+'><summary><span class="card-h"><b>'+esc(title||("Collecte des documents, "+f.name))+'</b><span class="big">'+s.pct+' %</span></span>'+bar(s.pct,"lg")+

  var cur="",shown=0;
  f.items.forEach(function(it){var st=colSt(it[0]);if(ui.colF!=="all"&&(st==="got"||st==="na"))return;shown++;

function blobDl(id,fmtk){var doc=docById(id),f=FMT.filter(function(z){return z[0]===fmtk})[0];if(!doc||!f)return;
  fetch(docDir(doc)+encodeURIComponent(doc.name+f[2]+".b64.txt")).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var bin=atob(t.trim()),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:f[3]})),a=document.createElement("a");a.href=url;a.download=doc.name+f[2];document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000)}).catch(function(){ui.dlMsg="Le fichier n’a pas pu être récupéré. Réessayez dans un instant.";render()})}
function mdHTML(t){
  var LBL={O:"Objectif",A:"Acteurs",D:"Durée",P:"Prérequis",L:"Livrable",C:"Critère de fin"};
  t=t.replace(/```mermaid[\s\S]*?```/,"Enchaînement : Phase 0 → Phase 1 (pilote Espaces verts) → porte « pilote validé ? » → Phase 2 (réplication) → Phase 3 (base de prix).").replace(/\\_/g,"_");
  function inl(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]*)`/g,"$1")}
  var L=t.split("\n"),h="",tb=[],fi=[],list="";
  function flush(){if(tb.length){h+='<div class="rt-wrap"><table class="rt">'+tb.map(function(r,i){return"<tr>"+r.map(function(c){return(i?"<td>":"<th>")+inl(c)+(i?"</td>":"</th>")}).join("")+"</tr>"}).join("")+"</table></div>";tb=[]}
    if(fi.length){h+='<div class="rt-wrap"><table class="rt fiche">'+fi.map(function(r){return"<tr><th>"+LBL[r[0]]+"</th><td>"+inl(r[1])+"</td></tr>"}).join("")+"</table></div>";fi=[]}
    if(list){h+="</"+list+">";list=""}}
  L.forEach(function(l){l=l.replace(/\s+$/,"");
    if(/^\|\s*-{3}/.test(l))return;
    if(l.charAt(0)==="|"){if(list||fi.length)flush();tb.push(l.slice(1,-1).split("|").map(function(c){return c.trim()}));return}
    var m=l.match(/^@@(\w)\|(.*)$/);if(m){if(tb.length||list)flush();fi.push([m[1],m[2]]);return}
    var nm=l.match(/^\d+\.\s(.*)$/),bul=l.match(/^\s*-\s(.*)$/);
    if(nm||bul){var k=nm?"ol":"ul";if(tb.length||fi.length)flush();if(list&&list!==k&&!/^\s/.test(l)){h+="</"+list+">";list=""}if(!list){h+="<"+k+">";list=k}h+="<li>"+inl((nm||bul)[1].replace(/^\[ \] /,"☐ "))+"</li>";return}
    flush();if(!l.trim())return;
    if(/^## /.test(l))h+="<h3>"+inl(l.slice(3))+"</h3>";else if(/^# /.test(l))h+="<h2>"+inl(l.slice(2))+"</h2>";
    else if(/^> /.test(l))h+="<blockquote>"+inl(l.slice(2))+"</blockquote>";else h+="<p>"+inl(l)+"</p>"});
  flush();return h;
}

  COL.forEach(function(f){f.items.forEach(function(it){L.push({k:"Collecte",c:it[0],t:it[2],s:f.name+", "+CST[colSt(it[0])],go:{col:f.id,item:it[0]}})})});
  REFS.forEach(function(x){L.push({k:"Référence",c:x.c,t:x.n,s:x.i,go:{ref:x.c}})});
  DOCS.forEach(function(g){g.items.forEach(function(x){L.push({k:"Document",c:"",t:x.t,s:x.v,go:{read:x.id}})})});
  COLLECTED.forEach(function(r,i){L.push({k:"Fichier",c:r.item||r.ref||"",t:r.name,s:r.fam,go:{file:i}})});
  state.journal.forEach(function(e){L.push({k:"Journal",c:fmt(e.date),t:e.text,s:e.type,go:{je:e.id}})});
  L.forEach(function(x){x.n=nrm(x.c+" "+x.t+" "+x.s)});return L}
function searchResults(q){q=nrm(q).trim();if(q.length<2)return[];if(!SIDX)SIDX=buildIndex();
  var terms=q.split(/\s+/);
  var res=SIDX.filter(function(x){return terms.every(function(w){return x.n.indexOf(w)>=0})});
  res.sort(function(a,b){var ea=nrm(a.c)===q?0:1,eb=nrm(b.c)===q?0:1;return ea-eb});
  return res.slice(0,14)}
function hi(s,q){s=String(s||"");var e=esc(s);if(!q)return e;var terms=nrm(q).split(/\s+/).filter(function(w){return w.length>1});
  if(!terms.length)return e;var n=nrm(s),marks=[];terms.forEach(function(w){var i=n.indexOf(w);if(i>=0)marks.push([i,i+w.length])});
  if(!marks.length)return e;marks.sort(function(a,b){return a[0]-b[0]});var out="",p=0;marks.forEach(function(m){if(m[0]<p)return;out+=esc(s.slice(p,m[0]))+"<mark>"+esc(s.slice(m[0],m[1]))+"</mark>";p=m[1]});return out+esc(s.slice(p))}
function searchPanel(q){var r=searchResults(q);
  if(nrm(q).trim().length<2)return"";
  if(!r.length)return'<div class="sr-empty">Aucun résultat pour « '+esc(q)+' ». Essayez un code (EVP03, V22, REF-013) ou un mot du titre.</div>';
  return r.map(function(x,i){return'<button class="sr" data-sr="'+i+'"><span class="sr-k">'+esc(x.k)+'</span><span class="sr-b"><b>'+(x.c?'<span class="sr-c">'+hi(x.c,q)+'</span> ':'')+hi(x.t.length>110?x.t.slice(0,108)+"…":x.t,q)+'</b><small>'+hi(x.s.length>120?x.s.slice(0,118)+"…":x.s,q)+'</small></span></button>'}).join("")}
var lastRes=[];
function updateSearch(){var inp=document.getElementById("srch"),box=document.getElementById("srbox");if(!inp||!box)return;
  ui.search=inp.value;lastRes=searchResults(inp.value);box.innerHTML=searchPanel(inp.value);box.hidden=!box.innerHTML}
function flash(id){var n=document.getElementById(id);if(!n)return;n.scrollIntoView({block:"center"});n.classList.add("flash");setTimeout(function(){n.classList.remove("flash")},2200)}
function goResult(x){var g=x.go;ui.search="";
  if(g.goto){ui.open[g.goto]=true;goTab("p0","act-"+g.goto.replace(".","-"));flash("act-"+g.goto.replace(".","-"));return}
  if(g.fam){ui.open.map=true;var ph=famPhase(g.fam),gr=GROUP[g.fam];if(ph===2&&gr){ui.open["p2:"+gr]=true;goTab("p2","p2-"+gr)}else goTab("p"+ph);setTimeout(function(){flash("map")},50);return}
  if(g.col){ui.open["c:"+g.col]=true;ui.colF="all";if(g.col==="EVP")goTab("p0");else{ui.open["p2:"+g.col]=true;goTab("p2")}flash("ci-"+g.item);return}
  if(g.ref){ui.open.refs=true;goTab("docs");flash("ref-"+g.ref);return}
  if(g.read){openReader(g.read);return}
  if(g.file!=null){var r=COLLECTED[g.file];ui.open["fc:"+r.fam]=true;goTab("docs");flash("cf-"+g.file);return}
  if(g.je){ui.jType="all";goTab("journal");flash("je-"+g.je);return}}
function toolsHTML(){
  return'<div class="tools"><div class="search"><label for="srch" class="sr-only">Rechercher</label><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input type="search" id="srch" autocomplete="off" placeholder="Rechercher un lot, un code (V22, EP19, REF-013), un document…" value="'+esc(ui.search||"")+'"><div class="srbox" id="srbox" role="listbox" hidden></div></div>'+
    '<button class="btn" id="rapport">Rapport d’avancement</button></div>'}

/* ================= rapport PDF ================= */
function reportData(){
  var rows=schedule(),g=colGlobal(),today=todayIso();
  var lt=[];ACTIONS.forEach(function(a){if(late(a))lt.push(a.c+" "+a.t+" (fin prévue semaine "+a.w[1]+")")});
  rows.forEach(function(r){var al=rowAlert(r);if(al)lt.push(r.t+" : "+al)});
  var dec=state.journal.filter(function(e){return e.type==="Décision"}).slice().sort(function(a,b){return a.date<b.date?1:-1}).slice(0,5);
  var av=state.journal.filter(function(e){return e.type!=="Décision"}).slice().sort(function(a,b){return a.date<b.date?1:-1}).slice(0,3);
  return{rows:rows,g:g,late:lt,dec:dec,av:av,today:today}}
var REPORT_PDF="docs/rapport/ASMA_Rapport_avancement_DCE.pdf";
function reportBody(){
  var R=reportData(),h='';
  function tbl(head,rows){return'<div class="rt-wrap"><table class="rt"><tr>'+head.map(function(x){return'<th>'+esc(x)+'</th>'}).join("")+'</tr>'+rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+esc(c)+'</td>'}).join("")+'</tr>'}).join("")+'</table></div>'}
  h+='<h2>1. État des 4 phases</h2>'+tbl(["Phase","Avancement","Statut","Début prévu","Fin au plus tard"],PHASES.map(function(ph,n){var rs=R.rows.filter(function(r){return r.n===n});return["Phase "+n+" : "+ph[1],phasePct(n)+" %",phaseSt(n),fmt(rs[0].a[0]),rs[rs.length-1].open?"en continu":fmt(rs[rs.length-1].b[1])]}));
  h+='<h2>2. Actions en retard et alertes de calendrier</h2>'+(R.late.length?'<ul>'+R.late.map(function(s){return'<li>'+esc(s)+'</li>'}).join("")+'</ul>':'<p>Aucune action en retard ni dépassement de durée à ce jour.</p>');
  h+='<h2>3. Phase 0 : actions</h2>'+tbl(["N°","Action","Statut","Étapes","Responsable"],ACTIONS.map(function(a){var x=state.actions[a.c];return[a.c,a.t,ST[x.status],stepsDone(a.c)+"/"+a.s.length,x.owner||"à désigner"]}));
  h+='<h2>4. Collecte des documents</h2>'+tbl(["Famille","Avancement","Priorité A","Reçus / attendus"],COL.map(function(f){var s=colStats(f);return[f.name,s.pct+" %",s.apct+" %",s.got+(s.part?" (+"+s.part+" en partie)":"")+" / "+s.n]}).concat([["Ensemble (documents communs comptés une fois)",R.g.pct+" %",R.g.apct+" %",R.g.got+" / "+R.g.n]]));
  h+='<h2>5. Indicateurs du plan</h2>'+tbl(["Indicateur","Cible","Valeur","État"],indicators().map(function(x){return[x.c,x.tgt,x.v==null||x.v===""?"—":String(x.v)+x.u,indStatus(x)[1]]}));
  h+='<h2>6. Dernières décisions</h2>'+(R.dec.length?tbl(["Date","Décision"],R.dec.map(function(e){return[fmt(e.date),e.text]})):'<p>Aucune décision consignée.</p>');
  h+='<h2>7. Dernières avancées</h2>'+tbl(["Date","Type","Avancée"],R.av.map(function(e){return[fmt(e.date),e.type,e.text]}));
  return h}
function reportHead(){return'<div class="rhead"><span class="plate"><img src="'+LOGO+'" alt="Agadir Souss Massa Aménagement" width="70" height="56"></span><div><div class="rt-title">Standardisation des DCE : rapport d’avancement</div><div class="muted">Agadir Souss Massa Aménagement, direction technique. Établi le '+fmt(todayIso())+(state.updated?", état du projet au "+fmt(state.updated):"")+(startIsProv()?". Début de phase 0 provisoire : "+fmt(START_DEFAULT):"")+'.</div></div></div>'}
function reportOverlay(){if(!ui.report)return"";
  return'<div class="reader" role="dialog" aria-modal="true" aria-label="Rapport d’avancement"><div class="rbar"><b>Rapport d’avancement</b><div class="btns">'+(D.REPORT_DATE?linkBtn(REPORT_PDF,"Télécharger le PDF"):'')+'<button class="btn ghost" data-rclose="1">Fermer</button></div></div><div class="rbody report">'+reportHead()+
    (D.REPORT_DATE?'<p class="help">Le PDF est produit à chaque synchronisation (dernière version du '+fmt(D.REPORT_DATE)+').</p>':'')+reportBody()+'</div></div>'}
function printMode(){try{return location.hash==="#rapport-imprimable"}catch(e){return false}}
function renderPrint(){document.getElementById("root").innerHTML='<div class="print report">'+reportHead()+reportBody()+'<p class="pfoot">ASMA, standardisation des DCE. Rapport établi automatiquement à partir de l’outil de suivi du projet ; les montants et les prix adjugés n’y figurent pas.</p></div>'}

/* ================= événements ================= */
function parseLots(txt){return txt.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean).map(function(s){var m=s.match(/^([A-Za-z]{1,3}\s?\d{1,3})\s*[;:\-–—\t]?\s*(.*)$/);return m?{code:m[1].replace(/\s/g,"").toUpperCase(),name:m[2].trim()}:{code:"",name:s}})}
function setVol(t){var val=t.value;if(t.type==="number")val=val===""?"":String(Math.max(0,num(val)));
  if(t.dataset.fe){var f=state.fams.filter(function(x){return x.id===t.dataset.fe})[0];if(f)f[t.dataset.fk]=t.dataset.fk==="code"?val.trim().toUpperCase():val;return}
  if(t.dataset.vf){var a=t.dataset.vf.split("|");state.vol[a[0]][a[1]][t.dataset.vk]=val;return}
  var b=t.dataset.vl.split("|"),w=state.vol[b[0]][b[1]],x=w.lots[b[2]];x[t.dataset.vk]=val;
  if(t.dataset.vk==="st"&&val!=="todo"&&val!=="na"&&w.st==="todo")w.st="doing"}
document.addEventListener("toggle",function(e){var d=e.target;if(d.tagName==="DETAILS"&&d.dataset.act)ui.open[d.dataset.act]=d.open},true);
document.addEventListener("click",function(e){
  if(!e.target.closest(".search")){var sb=document.getElementById("srbox");if(sb)sb.hidden=true}
  var t=e.target.closest("button");if(!t)return;var ds=t.dataset;
  if(ds.sr!=null){var x=lastRes[+ds.sr];if(x)goResult(x);return}
  if(t.id==="rapport"){ui.report=true;render();return}
  if(ds.maptoggle){var m=document.getElementById("map");ui.open.map=!ui.open.map;if(m){m.classList.toggle("open",ui.open.map);t.setAttribute("aria-expanded",String(ui.open.map));var l=t.querySelector(".map-l");if(l)l.textContent=ui.open.map?"Replier":"Déplier";if(ui.open.map)setTimeout(function(){m.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})},60)}return}
  if(ds.tab){goTab(ds.tab);return}
  if(ds.mode){ui.edit=ds.mode==="1";ui.jConfirm=null;render();return}
  if(ds.goto){ui.open[ds.goto]=true;goTab("p0","act-"+ds.goto.replace(".","-"));return}
  if(ds.fam){var ph=famPhase(ds.fam),g=GROUP[ds.fam];if(ph===2&&g){ui.open["p2:"+g]=true;goTab("p2","p2-"+g)}else goTab("p"+ph);return}
  if(ds.cgo){var id=ds.cgo;ui.open["c:"+id]=true;if(id==="EVP")goTab("p0","col-EVP");else{ui.open["p2:"+id]=true;goTab("p2","col-"+id)}return}
  if(ds.read){openReader(ds.read);return}
  if(ds.rclose){ui.read=null;ui.report=false;render();return}
  if(ds.dl){var q=ds.dl.split("|");dl(q[0],q[1]);return}
  if(ds.bdl){var q2=ds.bdl.split("|");blobDl(q2[0],q2[1]);return}
  if(ds.fget){var r=COLLECTED.filter(function(x){return x.name===ds.fget})[0];if(r)saveFile("docs/collecte/"+encodeURIComponent(r.name),r.name,"application/pdf");return}
  if(ds.jorder){ui.jDesc=!ui.jDesc;render();return}
  if(ds.jtype){ui.jType=ds.jtype;render();return}
  if(ds.chip){ask(ds.chip);return}
  if(t.id==="askbtn"){var qa=document.getElementById("q");ask(qa.value);qa.value="";return}
  if(ds.restore){if(ds.restore==="1"){try{state=JSON.parse(sessionStorage.getItem(PKEY));normState();ui.edit=ui.canEdit}catch(x){}}try{sessionStorage.removeItem(PKEY)}catch(x){}ui.restore=false;render();return}
  if(!ui.edit)return;
  if(ds.cancel){ui.jConfirm=null;render();return}
  if(t.id==="save"){save();return}
  if(t.id==="jadd"){var tx=document.getElementById("jtext").value.trim();if(!tx)return;state.journal.push({id:"j"+Date.now(),date:document.getElementById("jdate").value||new Date().toISOString().slice(0,10),type:document.getElementById("jtype").value,text:tx});ui.open.jadd=false;render();return}
  if(ds.jdel){ui.jConfirm=ds.jdel;render();return}
  if(ds.jdelok){state.journal=state.journal.filter(function(x){return x.id!==ds.jdelok});ui.jConfirm=null;render();return}
  if(ds.col){colSet(ds.col,ds.v);render();return}
  if(ds.ladd){var q2=ds.ladd.split("|"),f=state.fams.filter(function(x){return x.id===q2[1]})[0],ta=document.getElementById("al-"+q2[0].replace(".","")+"-"+q2[1]);
    if(f&&ta&&ta.value.trim()){parseLots(ta.value).forEach(function(l){if(l.code&&f.lots.some(function(o){return o.code===l.code}))return;f.lots.push({id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),code:l.code,name:l.name})});normVol();render()}return}
  if(ds.ldel){var q3=ds.ldel.split("|"),f3=state.fams.filter(function(x){return x.id===q3[0]})[0];if(f3){f3.lots=f3.lots.filter(function(l){return l.id!==q3[1]});normVol();render()}return}
  if(ds.fdel){ui.jConfirm="f:"+ds.fdel;render();return}
  if(ds.fdelok){state.fams=state.fams.filter(function(x){return x.id!==ds.fdelok});ui.jConfirm=null;normVol();render();return}
  if(ds.fadd){var k=ds.fadd.replace(".",""),cd=document.getElementById("nf-code-"+k).value.trim().toUpperCase(),nm=document.getElementById("nf-name-"+k).value.trim();if(!nm&&!cd)return;
    state.fams.push({id:"f"+Date.now().toString(36),code:cd,name:nm||"Famille "+cd,lots:[]});normVol();render();return}
});
document.addEventListener("change",function(e){var t=e.target,ds=t.dataset;
  if(ds.colf){ui.colF=t.value;render();return}
  if(!ui.edit)return;
  if(ds.pk){var q=ds.pk.split("|"),pp=state.prog;if(q[0]==="p2")pp.p2[q[1]][+q[2]]=t.checked;else pp[q[0]][+q[1]]=t.checked;render();return}
  if(t.id==="start"){state.start=t.value;render();return}
  if(ds.step!=null){var x=state.actions[ds.a];x.steps[+ds.step]=t.checked;if(x.status==="todo"&&x.steps.some(Boolean))x.status="doing";render();return}
  if(ds.k){state.actions[ds.a][ds.k]=t.value;render();return}
  if(ds.vf||ds.vl||ds.fe){setVol(t);render();return}
});
document.addEventListener("input",function(e){if(e.target.id==="srch"){updateSearch();return}var t=e.target,ds=t.dataset;if(!ui.edit)return;
  if((ds.vf||ds.vl||ds.fe)&&t.tagName==="INPUT"){setVol(t);refreshSavebar();return}
  if(ds.k==="note"||ds.k==="owner"){state.actions[ds.a][ds.k]=t.value;refreshSavebar()}
});
document.addEventListener("focusin",function(e){if(e.target.id==="srch"&&e.target.value)updateSearch()});
document.addEventListener("keydown",function(e){
  if(e.target.id==="srch"){if(e.key==="Enter"&&lastRes[0]){e.preventDefault();goResult(lastRes[0]);return}if(e.key==="Escape"){e.target.value="";updateSearch();return}}
  if(e.key==="Escape"&&(ui.read||ui.report)){ui.read=null;ui.report=false;render();return}
  if(e.target.id==="q"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();document.getElementById("askbtn").click()}});

/* ================= démarrage ================= */
try{var pend=sessionStorage.getItem(PKEY);if(pend){var pj=JSON.parse(pend);if(JSON.stringify(pj)===savedJSON||(pj.updated&&pj.updated===state.updated))sessionStorage.removeItem(PKEY);else ui.restore=true}}catch(x){}
if(printMode()){renderPrint();return}
render();
if(window.claude&&window.claude.use){
  var canPub=false,canUser=false;
  function upd(){ui.canEdit=canPub&&canUser;if(!ui.canEdit)ui.edit=false;render()}
  window.claude.use("downloads").then(function(ns){dlNS=ns;render()}).catch(function(){});
  window.claude.use("sample").then(function(ns){sampleNS=ns;render()}).catch(function(){});
}
})();
